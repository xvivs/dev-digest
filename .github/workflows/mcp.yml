# devdigest-mcp suite — the stdio MCP server (mcp/), a thin HTTP client of the
# DevDigest API. Hermetic tests only: the API is a fake, the SDK client talks to
# the server over an in-memory transport. Uses pnpm (mcp/pnpm-lock.yaml).
#
# server/src/vendor/shared/** is in the path filter because mcp aliases
# @devdigest/shared to it at type-check and test time.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
